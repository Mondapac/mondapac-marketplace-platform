name: Assistant real-model evaluation

# The buyer assistant's real-model evaluation (ADR-0019 decision 9; docs/modules/assistant/
# conversation.md, "Before the switch is turned on"): the synthetic evaluation set of the current
# prompt version, sent through the whole turn to the real provider. Run by hand only, from the
# Actions tab: it calls the provider and costs money. A capability is switched on only after this
# run is recorded as passed for that provider, model and prompt version.
#
# Secret: ASSISTANT_EVAL_MODEL_API_KEY in the GitHub Environment "assistant-eval" (required
# reviewer: the owner; deployment branches: main only), never a repository secret, so a branch that
# changed this file or the evaluation cannot reach the key (Hassan M1). It is the provider API key
# held under the no-retention, no-training contract the owner approved (R7), used for both Market
# fixtures of the run and never printed. All data sent is synthetic.
# ASSISTANT_EVAL_BEDROCK_API_KEY (same environment) is the Amazon Bedrock API key of the
# bedrock-mantle route in Sydney (ADR-0052 decision 5). AU has no other usable route (owner
# decision, 25 Nov 2026), so an AU pass needs it (Hassan, Bedrock Sydney review 2). At least one of
# the two keys is set.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Model family to evaluate (a family of the AI route catalogue, or a row's model id)
        required: true
        type: string

concurrency:
  group: assistant-eval
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  evaluate:
    name: Real-model evaluation (${{ inputs.model }})
    # Only the evaluation on main can count as the record.
    if: github.ref == 'refs/heads/main'
    environment: assistant-eval
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check the inputs and the key secret
        env:
          MODEL: ${{ inputs.model }}
          KEY: ${{ secrets.ASSISTANT_EVAL_MODEL_API_KEY }}
          BEDROCK_KEY: ${{ secrets.ASSISTANT_EVAL_BEDROCK_API_KEY }}
        run: |
          if [ -z "$KEY" ] && [ -z "$BEDROCK_KEY" ]; then
            echo "::error::Neither ASSISTANT_EVAL_MODEL_API_KEY nor ASSISTANT_EVAL_BEDROCK_API_KEY is set in the assistant-eval environment."
            exit 1
          fi
          if ! printf '%s' "$MODEL" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._:/@-]{0,99}$'; then
            echo "::error::The model id may hold letters, digits and . _ : / @ - only."
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the Prisma client
        run: pnpm db:generate

      # Both Market fixtures (AU and the synthetic ZZ), one key and one model family for both.
      # The family is the run's own input (ASSISTANT_EVAL_FAMILY): the model tiers went in AI
      # Gateway G4d1, and a Market's models are its list in settings.
      - name: Run the evaluation
        env:
          KEY: ${{ secrets.ASSISTANT_EVAL_MODEL_API_KEY }}
          BEDROCK_KEY: ${{ secrets.ASSISTANT_EVAL_BEDROCK_API_KEY }}
          ASSISTANT_EVAL_FAMILY: ${{ inputs.model }}
          ASSISTANT_EVAL_REPORT_DIR: ${{ github.workspace }}/assistant-eval-report
        run: |
          if [ -n "$KEY" ]; then
            export ASSISTANT_MODEL_API_KEY="AU=$KEY,ZZ=$KEY"
            echo "::add-mask::$ASSISTANT_MODEL_API_KEY"
          fi
          if [ -n "$BEDROCK_KEY" ]; then
            export AI_BEDROCK_API_KEY="AU=$BEDROCK_KEY,ZZ=$BEDROCK_KEY"
            echo "::add-mask::$AI_BEDROCK_API_KEY"
          fi
          unset KEY BEDROCK_KEY
          pnpm --filter @mondapac/api eval:assistant

      # The report holds the synthetic cases, what the model wrote and what the buyer would see;
      # never the key. Kept 90 days as the record of the run.
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assistant-eval-report
          path: assistant-eval-report/
          if-no-files-found: warn
          retention-days: 90
