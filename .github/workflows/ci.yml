name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request cancels its older run. On main every commit gets its own group
# and is never cancelled, so each merge gets a CI verdict of its own.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify (region ${{ matrix.region.name }}, Node ${{ matrix.node.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # One pipeline, region matrix (ADR-0003 decision 8). A Region Stack is added here
        # together with its config/markets/<CODE>.json; the matrix has one entry today.
        region:
          - name: au
            hosted_markets: AU
        # ADR-0021: the exact minimum of `engines` in package.json, and the version in
        # .nvmrc. Raise both together (ADR-0021 decision 3).
        node:
          - label: minimum
            version: 24.20.0
          - label: .nvmrc
            version-file: .nvmrc

    services:
      # Same image and major version as docker-compose.yml. Pulled from Google's mirror of the
      # official image: Docker Hub rate-limits anonymous pulls from CI runners, and the AWS public
      # mirror refuses them once its anonymous data limit is spent ("Data limit exceeded").
      postgres:
        image: mirror.gcr.io/library/postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mondapac
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d mondapac"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # Job level holds only what the application may see. MIGRATION_DATABASE_URL is set on the
    # two steps that need it, never here, so the boot probe runs without it
    # (docs/design/data/platform.md 10.7).
    env:
      DATABASE_URL: postgresql://mondapac_api:mondapac_api@localhost:5432/mondapac
      HOSTED_MARKETS: ${{ matrix.region.hosted_markets }}
      # The local subject-key wrapper starts only on an explicit development or test NODE_ENV
      # (identity slice 1c, security review M2).
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      # A service container cannot mount a repository file, so the bootstrap runs here. The
      # second run is the existing-volume path: the file must converge, not fail.
      - name: Create database roles (cluster bootstrap)
        run: |
          for run in 1 2; do
            docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -d mondapac < scripts/db/bootstrap-dev.sql
          done

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # One of the two is set per matrix entry; node-version wins when both are set.
          node-version: ${{ matrix.node.version }}
          node-version-file: ${{ matrix.node.version-file }}
          cache: pnpm

      - name: Show the Node.js version
        run: node --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      # Typecheck, lint, architecture boundaries and the up -> down -> up migration check. The
      # tests run in parallel jobs below: api-tests (the API's unit tests, three parts),
      # package-tests (every other workspace package) and db-tests (three parts). Together they
      # are `pnpm verify`, the command developers run locally. One job running all of it took
      # 20-30 minutes (owner decisions 2026-10-29 and 2026-11-06: split the tests).
      - name: Verify (static checks)
        run: pnpm verify:static
        env:
          MIGRATION_DATABASE_URL: postgresql://mondapac_migrator:mondapac_migrator@localhost:5432/mondapac

      - name: Build
        run: pnpm build

      - name: Apply migrations
        run: pnpm db:migrate
        env:
          MIGRATION_DATABASE_URL: postgresql://mondapac_migrator:mondapac_migrator@localhost:5432/mondapac

      # Job environment only: this process has no migration URL, and its start-up self-check
      # refuses any role but the application login.
      - name: Boot the API for this region, probe readiness and the security headers
        run: |
          APP_ROLE=api PORT=3000 node apps/api/dist/main &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:3000/health/ready; then
              # The security headers on a 200, a 404 and a 400 (slice 0 item 6).
              node scripts/check-http-headers.mjs http://localhost:3000
              exit $?
            fi
            sleep 1
          done
          echo "API did not become ready" >&2
          exit 1

      # PK2: the worker role opens no port and exits 0 on SIGTERM (main.ts handles the signal
      # itself; exit 143 would mean no handler ran).
      - name: Boot the worker role, check it opens no port and stops on SIGTERM
        run: |
          APP_ROLE=worker PORT=3100 node apps/api/dist/main &
          worker=$!
          sleep 8
          kill -0 "$worker" || { echo "Worker exited early" >&2; exit 1; }
          if ss -ltnp | grep -q "pid=$worker,"; then
            echo "Worker opened a listening port" >&2
            ss -ltnp | grep "pid=$worker," >&2
            exit 1
          fi
          kill -TERM "$worker"
          wait "$worker" || { echo "Worker did not stop cleanly on SIGTERM" >&2; exit 1; }

      # The only step that runs docker-compose.yml's PostgreSQL: the init-directory path of the
      # bootstrap and `pnpm db:bootstrap`. Port 5433 keeps it apart from the service container.
      - name: Compose smoke (PostgreSQL only)
        env:
          POSTGRES_PORT: '5433'
        run: |
          docker compose up -d --wait postgres
          state=$(docker compose exec -T postgres psql -U postgres -d mondapac -Atc "
            SELECT (SELECT count(*) FROM pg_roles
                     WHERE rolname IN ('mondapac_app', 'mondapac_api', 'mondapac_migrator')
                       AND NOT rolsuper)
                   || ' ' || pg_get_userbyid(datdba)
              FROM pg_database WHERE datname = current_database()")
          if [ "$state" != "3 mondapac_migrator" ]; then
            echo "The Compose bootstrap left roles and owner as: $state" >&2
            exit 1
          fi
          pnpm db:bootstrap

      - name: Compose smoke clean-up
        if: always()
        env:
          POSTGRES_PORT: '5433'
        run: |
          if [ "${{ job.status }}" != "success" ]; then docker compose logs postgres || true; fi
          docker compose down -v

  # The API's unit and e2e tests (`pnpm test:api`, the API part of `pnpm test`), split by spec
  # file into three parts that run in parallel (Jest --shard). Every spec file runs in exactly one
  # part. Same service, roles and environment as the verify job, where these tests ran before.
  api-tests:
    name: API tests (region ${{ matrix.region.name }}, Node ${{ matrix.node.label }}, part ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # Same region and Node entries as the verify job.
        region:
          - name: au
            hosted_markets: AU
        node:
          - label: minimum
            version: 24.20.0
          - label: .nvmrc
            version-file: .nvmrc
        shard: [1, 2, 3]

    services:
      # Same service as the verify job.
      postgres:
        image: mirror.gcr.io/library/postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mondapac
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d mondapac"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://mondapac_api:mondapac_api@localhost:5432/mondapac
      HOSTED_MARKETS: ${{ matrix.region.hosted_markets }}
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Create database roles (cluster bootstrap)
        run: docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -d mondapac < scripts/db/bootstrap-dev.sql

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node.version }}
          node-version-file: ${{ matrix.node.version-file }}
          cache: pnpm

      - name: Show the Node.js version
        run: node --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: API tests (part ${{ matrix.shard }} of 3)
        run: pnpm db:generate && pnpm test:api --shard=${{ matrix.shard }}/3
        env:
          MIGRATION_DATABASE_URL: postgresql://mondapac_migrator:mondapac_migrator@localhost:5432/mondapac

  # The tests of every workspace package except the API (`pnpm test:packages`: admin, seller, web,
  # ui, panel-server, shared-kernel), the rest of `pnpm test`. Same environment as the verify job.
  package-tests:
    name: Package tests (region ${{ matrix.region.name }}, Node ${{ matrix.node.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # Same region and Node entries as the verify job.
        region:
          - name: au
            hosted_markets: AU
        node:
          - label: minimum
            version: 24.20.0
          - label: .nvmrc
            version-file: .nvmrc

    env:
      DATABASE_URL: postgresql://mondapac_api:mondapac_api@localhost:5432/mondapac
      HOSTED_MARKETS: ${{ matrix.region.hosted_markets }}
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node.version }}
          node-version-file: ${{ matrix.node.version-file }}
          cache: pnpm

      - name: Show the Node.js version
        run: node --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package tests
        run: pnpm db:generate && pnpm test:packages

  # The database tests (`pnpm test:db`), split by spec file into three parts that run in parallel
  # (Jest --shard). Every spec file runs in exactly one part; each part migrates its own
  # throwaway database in its own PostgreSQL service.
  db-tests:
    name: Database tests (region ${{ matrix.region.name }}, Node ${{ matrix.node.label }}, part ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # Same region and Node entries as the verify job.
        region:
          - name: au
            hosted_markets: AU
        node:
          - label: minimum
            version: 24.20.0
          - label: .nvmrc
            version-file: .nvmrc
        shard: [1, 2, 3]

    services:
      # Same service as the verify job.
      postgres:
        image: mirror.gcr.io/library/postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mondapac
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d mondapac"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://mondapac_api:mondapac_api@localhost:5432/mondapac
      HOSTED_MARKETS: ${{ matrix.region.hosted_markets }}
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Create database roles (cluster bootstrap)
        run: docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -d mondapac < scripts/db/bootstrap-dev.sql

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node.version }}
          node-version-file: ${{ matrix.node.version-file }}
          cache: pnpm

      - name: Show the Node.js version
        run: node --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Database tests (part ${{ matrix.shard }} of 3)
        run: pnpm db:generate && pnpm test:db --shard=${{ matrix.shard }}/3
        env:
          MIGRATION_DATABASE_URL: postgresql://mondapac_migrator:mondapac_migrator@localhost:5432/mondapac
          # Fewer database spec files at once than Jest's default (cores - 1): under the full
          # parallel load a unit sometimes could not start its transaction in time (owner
          # decision 2026-10-20). Local runs keep the default.
          TEST_DB_MAX_WORKERS: '2'
