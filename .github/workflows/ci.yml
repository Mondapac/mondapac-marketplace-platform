name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (region ${{ matrix.region.name }}, Node ${{ matrix.node.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # One pipeline, region matrix (ADR-0003 decision 8). A Region Stack is added here
        # together with its config/markets/<CODE>.json; the matrix has one entry today.
        region:
          - name: au
            hosted_markets: AU
        # ADR-0021: the exact minimum of `engines` in package.json, and the version in
        # .nvmrc. Raise both together (ADR-0021 decision 3).
        node:
          - label: minimum
            version: 24.15.0
          - label: .nvmrc
            version-file: .nvmrc

    services:
      # Same major version as docker-compose.yml.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mondapac
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d mondapac"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # Job level holds only what the application may see. MIGRATION_DATABASE_URL is set on the
    # two steps that need it, never here, so the boot probe runs without it
    # (docs/design/data/platform.md 10.7).
    env:
      DATABASE_URL: postgresql://mondapac_api:mondapac_api@localhost:5432/mondapac
      HOSTED_MARKETS: ${{ matrix.region.hosted_markets }}

    steps:
      - uses: actions/checkout@v4

      # A service container cannot mount a repository file, so the bootstrap runs here. The
      # second run is the existing-volume path: the file must converge, not fail.
      - name: Create database roles (cluster bootstrap)
        run: |
          for run in 1 2; do
            docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -d mondapac < scripts/db/bootstrap-dev.sql
          done

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # One of the two is set per matrix entry; node-version wins when both are set.
          node-version: ${{ matrix.node.version }}
          node-version-file: ${{ matrix.node.version-file }}
          cache: pnpm

      - name: Show the Node.js version
        run: node --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      # Typecheck, lint, architecture boundaries, tests, database tests and the
      # up -> down -> up migration check: the same command developers run locally.
      - name: Verify
        run: pnpm verify
        env:
          MIGRATION_DATABASE_URL: postgresql://mondapac_migrator:mondapac_migrator@localhost:5432/mondapac

      - name: Build
        run: pnpm build

      - name: Apply migrations
        run: pnpm db:migrate
        env:
          MIGRATION_DATABASE_URL: postgresql://mondapac_migrator:mondapac_migrator@localhost:5432/mondapac

      # Job environment only: this process has no migration URL, and its start-up self-check
      # refuses any role but the application login.
      - name: Boot the API for this region and probe readiness
        run: |
          PORT=3000 node apps/api/dist/main &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:3000/health/ready; then exit 0; fi
            sleep 1
          done
          echo "API did not become ready" >&2
          exit 1

      # The only step that runs docker-compose.yml's PostgreSQL: the init-directory path of the
      # bootstrap and `pnpm db:bootstrap`. Port 5433 keeps it apart from the service container.
      - name: Compose smoke (PostgreSQL only)
        env:
          POSTGRES_PORT: '5433'
        run: |
          docker compose up -d --wait postgres
          roles=$(docker compose exec -T postgres psql -U postgres -d mondapac -Atc \
            "SELECT count(*) FROM pg_roles WHERE rolname IN ('mondapac_app', 'mondapac_api', 'mondapac_migrator')")
          if [ "$roles" != "3" ]; then
            echo "The Compose bootstrap created $roles of the 3 database roles" >&2
            docker compose down -v
            exit 1
          fi
          pnpm db:bootstrap
          docker compose down -v
